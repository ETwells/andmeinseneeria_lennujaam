version: 2

models:
  - name: OBT_TLL_arrivals_departures
    description: >
     Unified fact table containing arrivals to Tallinn Airport
     (TLL) and departures from Tallinn Airport (TLL),
     enriched with date and time dimensions."

    columns:
      - name: direction
        description: "Flight direction relative to Tallinn Airport. Values: arrival_TLL or departure_TLL."
        tests:
          - not_null

      - name: event_date
        description: "Flight arrival or departure date in Estonia local time."
        tests:
          - not_null

      - name: month_name
        description: "Month name derived from the date dimension."

      - name: weekday_name
        description: "Weekday name derived from the date dimension."

      - name: is_holiday
        description: "Indicates whether the date is an Estonian public holiday."

      - name: is_working_day
        description: "Indicates whether the date is a working day."

      - name: year
        description: "Year derived from the date dimension."

      - name: hour
        description: "Hour of arrival or departure in Estonia local time."

      - name: is_morning
        description: "True when the flight occurred between 06:00 and 11:59."

      - name: is_afternoon
        description: "True when the flight occurred between 12:00 and 17:59."

      - name: is_evening
        description: "True when the flight occurred between 18:00 and 21:59."

      - name: is_night
        description: "True when the flight occurred between 22:00 and 05:59."

      - name: departure_iata
        description: "IATA code of the departure airport."

      - name: departure_icao
        description: "ICAO code of the departure airport."

      - name: departure_airport_name
        description: "Name of the departure airport."

      - name: arrival_iata
        description: "IATA code of the arrival airport."

      - name: arrival_icao
        description: "ICAO code of the arrival airport."

      - name: arrival_airport_name
        description: "Name of the arrival airport."

      - name: loaded_at
        description: "Timestamp when the source record was loaded into the data warehouse."
