version: 2

models:
  - name: dim_date
    description: Date dimension used for analytical reporting and time-based aggregations.

    columns:
      - name: date_key
        description: Surrogate key in YYYYMMDD format.
        tests:
          - unique
          - not_null

      - name: full_date
        description: Calendar date.
        tests:
          - unique
          - not_null

      - name: day_of_week
        description: Name of the day of the week.

      - name: day_of_week_num
        description: Numeric day of the week.

      - name: is_weekend
        description: Indicates whether the date falls on a weekend.

      - name: is_holiday
        description: Indicates whether the date is an Estonian public holiday.

      - name: is_working_day
        description: Indicates whether the date is a working day.

      - name: season
        description: Season of the year.

      - name: month
        description: Month number.

      - name: year
        description: Calendar year.

  - name: dim_time
    description: Time dimension at one-minute granularity.

    columns:
      - name: time_key
        description: Surrogate key in HHMM format.
        tests:
          - unique
          - not_null

      - name: full_time
        description: Time value.
        tests:
          - unique
          - not_null

      - name: hour
        description: Hour of the day.

      - name: minute
        description: Minute of the hour.

      - name: time_hhmm
        description: Time formatted as HH:MM.

      - name: is_morning
        description: Indicates whether the time falls between 06:00 and 11:59.

      - name: is_afternoon
        description: Indicates whether the time falls between 12:00 and 17:59.

      - name: is_evening
        description: Indicates whether the time falls between 18:00 and 21:59.

      - name: is_night
        description: Indicates whether the time falls between 22:00 and 05:59.

      - name: is_business_hours
        description: Indicates whether the time falls within standard business hours.
