version: 2

models:
  - name: OBT_TLL_arrivals_departures
    description: >
     Unified fact table containing arrivals to Tallinn Airport
     (TLL) and departures from Tallinn Airport (TLL),
     enriched with date and time dimensions."

    columns:
      - name: direction
        description: "Flight direction relative to Tallinn Airport. Values: arrival_TLL or departure_TLL."
        tests:
          - not_null
          - accepted_values:
              values: ['arrival_TLL', 'departure_TLL']

      - name: event_date
        description: "Flight arrival or departure date in Estonia local time."
        tests:
          - not_null

      - name: month_name
        description: "Month name derived from the date dimension."

      - name: weekday_name
        description: "Weekday name derived from the date dimension."

      - name: is_holiday
        description: "Indicates whether the date is an Estonian public holiday."

      - name: is_working_day
        description: "Indicates whether the date is a working day."

      - name: year
        description: "Year derived from the date dimension."

      - name: hour
        description: "Hour of arrival or departure in Estonia local time."

      - name: is_morning
        description: "True when the flight occurred between 06:00 and 11:59."

      - name: is_afternoon
        description: "True when the flight occurred between 12:00 and 17:59."

      - name: is_evening
        description: "True when the flight occurred between 18:00 and 21:59."

      - name: is_night
        description: "True when the flight occurred between 22:00 and 05:59."

      - name: departure_iata
        description: "IATA code of the departure airport."

      - name: departure_icao
        description: "ICAO code of the departure airport."

      - name: departure_airport_name
        description: "Name of the departure airport."

      - name: arrival_iata
        description: "IATA code of the arrival airport."

      - name: arrival_icao
        description: "ICAO code of the arrival airport."

      - name: arrival_airport_name
        description: "Name of the arrival airport."

      - name: loaded_at
        description: "Timestamp when the source record was loaded into the data warehouse."

  - name: dim_date
    description: >
      Kuupäevadimensioon vahemikus 1965-2050, mis sisaldab nädalapäeva,
      kuu, kvartali ning püha-, nädalavahetuse- ja tööpäevalippe.

    columns:
      - name: date_key
        description: "Kuupäeva tehniline võti kujul YYYYMMDD."
        tests:
          - not_null
          - unique

      - name: full_date
        description: "Kuupäev (kuupäevatüüp), mille külge OBT sündmused liidetakse."
        tests:
          - not_null
          - unique

      - name: day_of_week_num
        description: "Nädalapäeva number (ISO: 1 = esmaspäev ... 7 = pühapäev)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 7

      - name: month
        description: "Kuu number (1-12)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 12

      - name: quarter
        description: "Kvartali number (1-4)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 4

      - name: is_weekend
        description: "Tõene, kui kuupäev on laupäev või pühapäev."
        tests:
          - not_null

      - name: is_holiday
        description: "Tõene, kui kuupäev on Eesti riigipüha."
        tests:
          - not_null

      - name: is_working_day
        description: "Tõene, kui kuupäev on tööpäev (mitte nädalavahetus ega püha)."
        tests:
          - not_null

  - name: dim_time
    description: >
      Ajadimensioon minutise sammuga (00:00-23:59), mis sisaldab tundi,
      minutit ning päevaosa lippe (hommik, pärastlõuna, õhtu, öö).

    columns:
      - name: time_key
        description: "Kellaaja tehniline võti kujul HH24MI."
        tests:
          - not_null
          - unique

      - name: full_time
        description: "Kellaaeg (ajatüüp), mille külge OBT sündmused liidetakse."
        tests:
          - not_null
          - unique

      - name: hour
        description: "Tund (0-23)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23

      - name: minute
        description: "Minut (0-59)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 59

      - name: is_morning
        description: "Tõene, kui kellaaeg jääb vahemikku 06:00-11:59."
        tests:
          - not_null

      - name: is_afternoon
        description: "Tõene, kui kellaaeg jääb vahemikku 12:00-17:59."
        tests:
          - not_null

      - name: is_evening
        description: "Tõene, kui kellaaeg jääb vahemikku 18:00-21:59."
        tests:
          - not_null

      - name: is_night
        description: "Tõene, kui kellaaeg jääb vahemikku 22:00-05:59."
        tests:
          - not_null
